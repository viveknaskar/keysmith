<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Keysmith">
  <defs>
    <linearGradient id="ks-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="ks-key" gradientUnits="userSpaceOnUse" x1="14" y1="6" x2="34" y2="44">
      <stop offset="0" stop-color="#cdd8fc"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <radialGradient id="ks-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ks-tile)" stroke="#2e2e38" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="21" fill="url(#ks-glow)"/>

  <g transform="translate(8,8)" stroke="url(#ks-key)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hexagonal bow (forged head) -->
    <path d="M24 6 L32.66 11 L32.66 21 L24 26 L15.34 21 L15.34 11 Z"/>
    <!-- Shaft -->
    <line x1="24" y1="26" x2="24" y2="43"/>
    <!-- Teeth -->
    <line x1="24" y1="35" x2="31" y2="35"/>
    <line x1="24" y1="42" x2="29" y2="42"/>
    <!-- Keyhole -->
    <circle cx="24" cy="16" r="3" fill="url(#ks-key)" stroke="none"/>
  </g>
</svg>

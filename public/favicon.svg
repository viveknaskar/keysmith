<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#050505"/>

  <!-- Shield shape -->
  <path
    d="M16 4L6 8v7c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V8L16 4z"
    fill="url(#shieldGrad)"
    opacity="0.15"
  />
  <path
    d="M16 4L6 8v7c0 5.5 4.3 10.7 10 12 5.7-1.3 10-6.5 10-12V8L16 4z"
    stroke="url(#strokeGrad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Lock body -->
  <rect x="12" y="16" width="8" height="6" rx="1.5" fill="url(#cyanGrad)"/>

  <!-- Lock shackle -->
  <path
    d="M13.5 16v-2a2.5 2.5 0 0 1 5 0v2"
    stroke="url(#cyanGrad)"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Lock keyhole -->
  <circle cx="16" cy="19" r="1" fill="#050505"/>

  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="12" y1="14" x2="20" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
</svg>
